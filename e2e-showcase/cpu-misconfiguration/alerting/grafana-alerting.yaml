apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  labels:
    app: grafana
data:
  alerting.yaml: |
    apiVersion: 1

    contactPoints:
      - orgId: 1
        name: kafka-rest-proxy
        receivers:
          - uid: kafka-rest-proxy-1
            type: kafka
            settings:
              kafkaRestProxy: http://kafka-rest-proxy.${HUB_NAMESPACE}.svc:8082
              kafkaTopic: system-alerts
            disableResolveMessage: false

    policies:
      - orgId: 1
        receiver: kafka-rest-proxy
        group_by:
          - grafana_folder
          - alertname
        group_wait: 30s
        group_interval: 1m
        repeat_interval: 1m

    groups:
      - orgId: 1
        name: edge-alerts
        folder: edge-alerts
        interval: 1m
        rules:
          - uid: queue-depth-alert
            title: High Queue Depth
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: loki-application
                model:
                  expr: |
                    max(max_over_time(
                      {kubernetes_namespace_name="${EDGE_NAMESPACE}"} |= "queue_depth" | json | __error__="" | line_format "{{.message}}" | json | __error__="" | unwrap queue_depth [1m]
                    ))
                  queryType: range
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: max
                  refId: B
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 10
                  refId: C
            for: 2m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: critical
            annotations:
              summary: Queue depth exceeded threshold
              description: >-
                Queue depth exceeded threshold in namespace ${EDGE_NAMESPACE}.
