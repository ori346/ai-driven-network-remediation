{{- if .Values.grafana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ include "lokistack.namespace" . }}
  labels:
    {{- include "lokistack.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
spec:
  replicas: {{ .Values.grafana.replicas }}
  selector:
    matchLabels:
      {{- include "lokistack.componentSelectorLabels" (dict "root" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lokistack.componentSelectorLabels" (dict "root" . "component" "grafana") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.grafana.rbac.serviceAccount.name }}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.grafana.service.port }}
              protocol: TCP
          env:
            - name: GF_INSTALL_PLUGINS
              value: ""
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: loki-client-cert
              mountPath: /var/run/tls/loki
              readOnly: true
            - name: loki-ca
              mountPath: /var/run/ca/loki
              readOnly: true
            {{- if .Values.grafana.alerting.enabled }}
            - name: grafana-alerting
              mountPath: /etc/grafana/provisioning/alerting
            {{- end }}
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
        {{- if .Values.grafana.alerting.enabled }}
        - name: alerting-sidecar
          image: {{ .Values.grafana.alerting.sidecar.image.repository }}:{{ .Values.grafana.alerting.sidecar.image.tag }}
          imagePullPolicy: {{ .Values.grafana.alerting.sidecar.image.pullPolicy }}
          env:
            - name: LABEL
              value: {{ .Values.grafana.alerting.sidecar.label | quote }}
            - name: LABEL_VALUE
              value: {{ .Values.grafana.alerting.sidecar.labelValue | quote }}
            - name: FOLDER
              value: /etc/grafana/provisioning/alerting
            - name: NAMESPACE
              value: {{ include "lokistack.namespace" . }}
            - name: RESOURCE
              value: configmap
            - name: REQ_URL
              value: http://localhost:{{ .Values.grafana.service.port }}/api/admin/provisioning/alerting/reload
            - name: REQ_METHOD
              value: POST
            - name: REQ_USERNAME
              value: {{ .Values.grafana.adminUser | quote }}
            - name: REQ_PASSWORD
              value: {{ .Values.grafana.adminPassword | quote }}
          volumeMounts:
            - name: grafana-alerting
              mountPath: /etc/grafana/provisioning/alerting
          resources:
            {{- toYaml .Values.grafana.alerting.sidecar.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: grafana-config
          configMap:
            name: grafana-config
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: loki-client-cert
          secret:
            secretName: {{ .Values.lokistack.name }}-gateway-client-http
        - name: loki-ca
          configMap:
            name: {{ .Values.lokistack.name }}-ca-bundle
        {{- if .Values.grafana.alerting.enabled }}
        - name: grafana-alerting
          emptyDir: {}
        {{- end }}
{{- end }}
