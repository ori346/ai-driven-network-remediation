{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ include "lokistack.namespace" . }}
  labels:
    {{- include "lokistack.componentLabels" (dict "root" . "component" "grafana") | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      {{- if .Values.grafana.datasources.loki.application.enabled }}
      - name: {{ .Values.grafana.datasources.loki.application.name }}
        uid: loki-application
        type: loki
        access: proxy
        url: {{ include "lokistack.lokiQueryFrontendUrl" . }}
        isDefault: {{ .Values.grafana.datasources.loki.application.isDefault }}
        editable: false
        jsonData:
          tlsAuth: true
          tlsAuthWithCACert: true
          httpHeaderName1: 'X-Scope-OrgID'
        secureJsonData:
          httpHeaderValue1: 'application'
          tlsCACert: '$__file{/var/run/ca/loki/service-ca.crt}'
          tlsClientCert: '$__file{/var/run/tls/loki/tls.crt}'
          tlsClientKey: '$__file{/var/run/tls/loki/tls.key}'
      {{- end }}
      {{- if .Values.grafana.datasources.loki.infrastructure.enabled }}
      - name: {{ .Values.grafana.datasources.loki.infrastructure.name }}
        uid: loki-infrastructure
        type: loki
        access: proxy
        url: {{ include "lokistack.lokiQueryFrontendUrl" . }}
        isDefault: {{ .Values.grafana.datasources.loki.infrastructure.isDefault }}
        editable: false
        jsonData:
          tlsAuth: true
          tlsAuthWithCACert: true
          httpHeaderName1: 'X-Scope-OrgID'
        secureJsonData:
          httpHeaderValue1: 'infrastructure'
          tlsCACert: '$__file{/var/run/ca/loki/service-ca.crt}'
          tlsClientCert: '$__file{/var/run/tls/loki/tls.crt}'
          tlsClientKey: '$__file{/var/run/tls/loki/tls.key}'
      {{- end }}
      {{- if .Values.grafana.datasources.loki.audit.enabled }}
      - name: {{ .Values.grafana.datasources.loki.audit.name }}
        uid: loki-audit
        type: loki
        access: proxy
        url: {{ include "lokistack.lokiQueryFrontendUrl" . }}
        isDefault: {{ .Values.grafana.datasources.loki.audit.isDefault }}
        editable: false
        jsonData:
          tlsAuth: true
          tlsAuthWithCACert: true
          httpHeaderName1: 'X-Scope-OrgID'
        secureJsonData:
          httpHeaderValue1: 'audit'
          tlsCACert: '$__file{/var/run/ca/loki/service-ca.crt}'
          tlsClientCert: '$__file{/var/run/tls/loki/tls.crt}'
          tlsClientKey: '$__file{/var/run/tls/loki/tls.key}'
      {{- end }}
{{- end }}
